<div class="text-center"><img align="bottom" class="img-fluid rounded mb-4" height="160" src="images/magick.png" width="120"/></div>
<hr class="my-4"/>
<p>This option is useful for regulating the animation of GIF images
within Netscape.. <i>1/100ths of a second</i> must expire before
the display of the next image. The default is no delay between each
showing of the image sequence. The maximum delay is 65535.</p>
