<title>Scene Option</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/><meta content="width=device-width, initial-scale=1" name="viewport"/></head>
<body class="bg-light text-dark"><div class="container my-5"><div class="row justify-content-center"><div class="col-lg-8">
<div class="text-center"><img align="bottom" class="img-fluid rounded mb-4" height="160" src="images/magick.png" width="120"/></div>
<hr class="my-4"/>
<p>Use an optional sub-image specification to select a desired
scene of a multi-resolution image format like Photo CD (e.g. 4) or
a range for MPEG images (e.g. video.mpg[50-75]). A scene
specification can be disjoint (e.g. 2,7,4). For raw images, specify
a scene as a geometry (e.g. 320x256+50+50).</p>
<hr class="my-4"/>

</div></div></div></body>
